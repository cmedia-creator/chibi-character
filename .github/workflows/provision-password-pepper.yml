name: provision-password-pepper-once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/provision-password-pepper.yml'

permissions:
  contents: read

jobs:
  provision:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm install

      - name: Wait for password-auth Worker code
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            tmp=$(mktemp)
            code=$(curl -sS -o "$tmp" -w '%{http_code}' \
              -X POST \
              -H 'content-type: application/json' \
              --data '{"loginId":"pepper-probe"}' \
              https://chibi-character.c-media-satoru.workers.dev/api/auth/password/params || true)
            if [ "$code" = '503' ] && grep -q 'Password authentication is not configured' "$tmp"; then
              exit 0
            fi
            if [ "$code" = '200' ]; then
              echo 'Password authentication is already configured; refusing to rotate PASSWORD_PEPPER.'
              exit 2
            fi
            sleep 5
          done
          echo 'Timed out waiting for password-auth Worker code.'
          exit 1

      - name: Generate and install PASSWORD_PEPPER
        id: secret_version
        shell: bash
        run: |
          set -euo pipefail
          pepper=$(openssl rand -hex 32)
          echo "::add-mask::$pepper"
          output=$(printf '%s' "$pepper" | npx wrangler versions secret put PASSWORD_PEPPER 2>&1)
          version_id=$(printf '%s\n' "$output" | sed -nE 's/.*Created version ([0-9a-fA-F-]{36}) with secret.*/\1/p' | tail -n 1)
          test -n "$version_id" || { echo 'Could not determine created Worker version id'; exit 1; }
          echo "version_id=$version_id" >> "$GITHUB_OUTPUT"
          unset pepper

      - name: Deploy pepper Worker version
        run: npx wrangler versions deploy "${{ steps.secret_version.outputs.version_id }}" --yes

      - name: Verify password auth is configured
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            tmp=$(mktemp)
            code=$(curl -sS -o "$tmp" -w '%{http_code}' \
              -X POST \
              -H 'content-type: application/json' \
              --data '{"loginId":"pepper-probe"}' \
              https://chibi-character.c-media-satoru.workers.dev/api/auth/password/params || true)
            if [ "$code" = '200' ] && grep -q '"iterations":120000' "$tmp"; then
              echo 'PASSWORD_PEPPER is active.'
              exit 0
            fi
            sleep 5
          done
          echo 'PASSWORD_PEPPER verification failed.'
          exit 1
