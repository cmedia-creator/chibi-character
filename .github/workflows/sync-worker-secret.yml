name: sync-worker-secret

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-worker-secret.yml'

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm install

      - name: Validate required secrets
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'CLOUDFLARE_API_TOKEN is missing'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'CLOUDFLARE_ACCOUNT_ID is missing'; exit 1; }
          test -n "$TURNSTILE_SECRET" || { echo 'TURNSTILE_SECRET is missing'; exit 1; }

      - name: Sync Turnstile secret to Worker
        shell: bash
        run: |
          printf '%s' "$TURNSTILE_SECRET" | npx wrangler secret put TURNSTILE_SECRET

      - name: Verify live Turnstile wiring
        shell: bash
        run: |
          set -euo pipefail
          tmp=$(mktemp)
          code=$(curl -sS -o "$tmp" -w '%{http_code}' \
            -X POST \
            -H 'content-type: application/json' \
            --data '{}' \
            https://chibi-character.c-media-satoru.workers.dev/api/auth/register/options)
          cat "$tmp"
          test "$code" = '400'
          grep -q 'Turnstile token is required' "$tmp"

      - name: Verify login options reach D1-backed Passkey service
        shell: bash
        run: |
          set -euo pipefail
          tmp=$(mktemp)
          code=$(curl -sS -o "$tmp" -w '%{http_code}' \
            -X POST \
            -H 'content-type: application/json' \
            --data '{}' \
            https://chibi-character.c-media-satoru.workers.dev/api/auth/login/options)
          cat "$tmp"
          test "$code" = '200'
          grep -q '"challenge"' "$tmp"
