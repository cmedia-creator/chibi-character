name: diag-auth-db

on:
  push:
    branches: ['diag/auth-db-check']
    paths: ['.github/workflows/diag-auth-db.yml']

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install
      - name: Inspect password auth rows
        run: |
          npx wrangler d1 execute chibi-character-db --remote --command "SELECT 'users' AS table_name, COUNT(*) AS count FROM users UNION ALL SELECT 'password_credentials', COUNT(*) FROM password_credentials UNION ALL SELECT 'sessions', COUNT(*) FROM sessions UNION ALL SELECT 'characters', COUNT(*) FROM characters;"
