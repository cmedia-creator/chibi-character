name: diag-passkey

on:
  push:
    branches: ['diag/passkey-registration']
    paths: ['.github/workflows/diag-passkey.yml']

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install
      - name: Inspect auth table counts
        run: |
          npx wrangler d1 execute chibi-character-db --remote --command "SELECT 'users' AS table_name, COUNT(*) AS count FROM users UNION ALL SELECT 'webauthn_challenges', COUNT(*) FROM webauthn_challenges UNION ALL SELECT 'passkey_credentials', COUNT(*) FROM passkey_credentials UNION ALL SELECT 'sessions', COUNT(*) FROM sessions;"
