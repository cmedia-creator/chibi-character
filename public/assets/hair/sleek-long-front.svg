  <path d="M267 116c14 22 33 41 56 58 25 19 43 42 54 70-27-18-53-29-77-33-18-24-29-56-33-95Z" fill="url(#hair)"/>

  <path d="M142 128c31-38 71-58 121-61 50 3 90 23 121 61-43-19-83-29-121-29s-78 10-121 29Z" fill="url(#shine)"/>
