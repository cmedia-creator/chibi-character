<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#111018" />
    <title>CHIBI LIFE - Phase 1 Prototype</title>
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">PHASE 1 / TECHNICAL PROTOTYPE</p>
          <h1>CHIBI LIFE</h1>
        </div>
        <span class="badge" id="engine-status">LOADING</span>
      </header>

      <nav class="app-nav" aria-label="メインメニュー">
        <a href="/" data-nav="live">LIVE</a>
        <a href="/?creator=1&auth=1" data-nav="creator">CREATE</a>
        <a href="/?profile=1&auth=1" data-nav="profile">PROFILE</a>
        <a href="/?share=1" data-nav="share">SHARE</a>
      </nav>

      <section class="stage-card" aria-label="正式テストキャラクター技術プロトタイプ">
        <div class="stage-glow stage-glow-a"></div>
        <div class="stage-glow stage-glow-b"></div>
        <div class="stage-floor"></div>
        <div id="pixi-stage"></div>
        <div class="stage-copy">
          <span id="character-source">TEST CHARACTER 01 / LOCAL</span>
          <strong id="action-status">起動中...</strong>
        </div>
      </section>

      <section class="controls" aria-label="Phase 1 motion controls">
        <div class="control-grid">
          <button type="button" id="blink-button">瞬き</button>
          <button type="button" id="wave-button">手を振る</button>
          <button type="button" id="heart-button">ハート</button>
          <button type="button" id="walk-button">歩く</button>
          <button type="button" id="sit-button">座る</button>
        </div>
        <p>idle / blink / look / sway / walk / sit / heart は端末内で処理します。自律行動は一定間隔で発生し、キャラタップでは挨拶、連続タップでは反応が変わります。</p>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
    <script type="module" src="/src/auth/auth-entry.ts"></script>
  </body>
</html>
