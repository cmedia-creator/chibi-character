<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#111018" />
    <title>CHIBI LIFE - Phase 1 Prototype</title>
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">PHASE 1 / TECHNICAL PROTOTYPE</p>
          <h1>CHIBI LIFE</h1>
        </div>
        <span class="badge" id="engine-status">LOADING</span>
      </header>

      <section class="stage-card" aria-label="正式テストキャラクター技術プロトタイプ">
        <div class="stage-glow stage-glow-a"></div>
        <div class="stage-glow stage-glow-b"></div>
        <div class="stage-floor"></div>
        <div id="pixi-stage"></div>
        <div class="stage-copy">
          <span>TEST CHARACTER 01</span>
          <strong id="action-status">起動中...</strong>
        </div>
      </section>

      <section class="controls" aria-label="Gate 1 controls">
        <div class="control-grid">
          <button type="button" id="blink-button">瞬きテスト</button>
          <button type="button" id="wave-button">手を振るテスト</button>
        </div>
        <p>正式テストキャラ01の仮組み版です。idle は常時自動、blink は自動＋手動、wave はボタンまたはキャラタップで確認できます。見た目のズレはこの表示を見てまとめて修正します。</p>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
